<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Carrito — WS Piscinas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="font-sans antialiased text-slate-800">

  <header class="bg-white shadow sticky top-0 z-40">
    <div class="container mx-auto flex justify-between items-center py-4 px-6">
      <a href="index.html" class="flex items-center gap-2">
        <img src="images/LogoWSpiscinas.jpg" alt="WS Piscinas" class="h-12">
        <span class="font-bold text-xl text-sky-600">WS Piscinas</span>
      </a>
      <nav class="hidden md:flex gap-6 text-sm font-semibold text-slate-700">
        <a href="index.html" class="hover:text-sky-600">Inicio</a>
        <a href="productos.html" class="hover:text-sky-600">Productos</a>
        <a href="servicios.html" class="hover:text-sky-600">Servicios</a>
        <a href="#contacto" class="hover:text-sky-600">Contacto</a>
      </nav>
      <a href="productos.html" class="hidden md:inline-flex bg-sky-600 text-white px-5 py-2 rounded-full shadow">Seguir comprando</a>
    </div>
  </header>

  <main class="container mx-auto px-6 py-12">
    <h1 class="text-2xl font-bold mb-6">Tu carrito</h1>

    <div id="cart-container" class="space-y-4">
      <!-- listado dinámico -->
    </div>

    <div class="mt-6 flex justify-between items-center">
      <div>
        <button id="clear-cart" class="bg-red-600 text-white px-4 py-2 rounded">Vaciar carrito</button>
      </div>
      <div class="text-right">
        <div class="text-sm text-slate-600">Total</div>
        <div id="cart-total" class="text-2xl font-bold text-sky-600">$0</div>
        <div class="mt-3">
          <button id="checkout-btn" class="bg-sky-600 text-white px-6 py-2 rounded font-semibold">Ir a pagar</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-white py-6 mt-12 text-center">© WS Piscinas</footer>

  <script>
    // utilidades
    function fmt(n){ return '$' + Number(n).toLocaleString('es-CL'); }
    function getCart(){ return JSON.parse(localStorage.getItem('ws_cart')||'[]'); }
    function saveCart(c){ localStorage.setItem('ws_cart', JSON.stringify(c)); }

    function render(){
      const container = document.getElementById('cart-container');
      const totalEl = document.getElementById('cart-total');
      const items = getCart();
      container.innerHTML = '';
      if (!items.length){
        container.innerHTML = '<p class="text-slate-600">No hay productos en el carrito. <a href="productos.html" class="text-sky-600 underline">Ir a productos</a></p>';
        totalEl.textContent = fmt(0);
        document.getElementById('checkout-btn').disabled = true;
        return;
      }
      document.getElementById('checkout-btn').disabled = false;
      let total = 0;
      items.forEach((it, idx) => {
        const subtotal = Number(it.unitPrice||0) * Number(it.quantity||1);
        total += subtotal;
        const row = document.createElement('div');
        row.className = 'p-4 bg-white border rounded flex items-center justify-between';
        row.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${it.image||'images/logo.png'}" alt="" class="w-20 h-20 object-cover rounded">
            <div>
              <div class="font-semibold">${it.name}</div>
              <div class="text-sm text-slate-600">${fmt(it.unitPrice)} c/u</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <input type="number" min="1" value="${it.quantity}" data-idx="${idx}" class="w-20 border rounded px-2 py-1 text-center quantity-input">
            <div class="font-bold text-sky-600">${fmt(subtotal)}</div>
            <button data-idx="${idx}" class="remove-btn text-red-600">Eliminar</button>
          </div>
        `;
        container.appendChild(row);
      });
      totalEl.textContent = fmt(total);
      // listeners
      container.querySelectorAll('.quantity-input').forEach(input=>{
        input.addEventListener('change', (e)=>{
          const i = Number(e.target.dataset.idx);
          const q = Math.max(1, Number(e.target.value||1));
          const cart = getCart();
          cart[i].quantity = q;
          saveCart(cart);
          render();
        });
      });
      container.querySelectorAll('.remove-btn').forEach(b=>{
        b.addEventListener('click', (e)=>{
          const i = Number(e.target.dataset.idx);
          const cart = getCart();
          cart.splice(i,1);
          saveCart(cart);
          render();
        });
      });
    }

    document.getElementById('clear-cart').addEventListener('click', ()=>{
      if (!confirm('Vaciar carrito?')) return;
      localStorage.removeItem('ws_cart');
      render();
    });

    document.getElementById('checkout-btn').addEventListener('click', ()=>{
      const items = getCart();
      if (!items.length) return alert('No hay productos en el carrito.');
      // guardar temporal para la página de pago
      sessionStorage.setItem('ws_checkout', JSON.stringify(items));
      // redirigir a pago.html
      location.href = 'pago.html';
    });

    // inicializa
    render();
  </script>
</body>
</html>
